name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check (lint + format)
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      - name: Run security integration tests
        run: pnpm run test:integration

      - name: Verify packed CLI security boundaries
        shell: bash
        run: |
          archive="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          install_dir="$RUNNER_TEMP/nopeek-packed"
          npm install --ignore-scripts --no-audit --no-package-lock --prefix "$install_dir" "$RUNNER_TEMP/$archive"
          NOPEEK_TEST_CLI="$install_dir/node_modules/nopeek/dist/index.js" pnpm exec vp test src/integration/security.test.ts

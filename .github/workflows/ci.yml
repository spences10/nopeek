name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check (lint + format)
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      - name: Run portable security integration tests
        run: pnpm run test:integration

      - name: Verify CLI works
        run: node dist/index.js --help
